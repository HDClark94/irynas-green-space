      amount: 8.64
      note: freight, duty and getting it here
    - label: VAT (23%)
      amount: 12.72
      note: collected on behalf of the tax authority
    - label: Card fees
      amount: 1.27
      note: what the payment processor takes
    - label: The shop
      amount: 22.69
      note: rent, utilities, wages and restocking

