# The shop.
#
# checkout_url is a Stripe Payment Link. Leave it blank and the card shows
# "Ask in store" instead of a buy button. See the Payments section of README.md.
#
# PRICES AND BREAKDOWNS BELOW ARE ILLUSTRATIVE. Replace with real figures before
# launch. scripts/check_products.py verifies that every breakdown sums exactly to
# its price and that the VAT line matches the configured rate - run `make check`.
#
# VAT is 23% (Portugal mainland) and is computed from the GROSS price:
#   vat = gross * 23 / (100 + 23)
# Not gross * 0.23. Getting this wrong overstates the tax by about a fifth,
# which on a page about honesty would be an unfortunate place to slip.

- name: Hand-hammered singing bowl
  note: Medium, around 18 cm
  description: >
    Hammered by hand in the Kathmandu valley. Deep, long sustain with a slow
    beat. Comes with a suede mallet and a ring cushion.
  price: 68.00
  origin: Nepal
  checkout_url:
